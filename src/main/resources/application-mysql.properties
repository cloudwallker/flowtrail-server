spring.datasource.url=${FLOWTRAIL_DB_URL:jdbc:mysql://127.0.0.1:3306/flowtrail_runtime?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${FLOWTRAIL_DB_USER:flowtrail}
spring.datasource.password=${FLOWTRAIL_DB_PASSWORD:}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
