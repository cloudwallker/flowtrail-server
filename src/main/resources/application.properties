spring.application.name=flowtrail-server
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:18081}
spring.datasource.url=${FLOWTRAIL_DB_URL:jdbc:h2:file:./data/flowtrail;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.threads.virtual.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.parser.strict-duplicate-detection=true
spring.main.banner-mode=off
server.error.include-message=never
server.error.include-stacktrace=never
