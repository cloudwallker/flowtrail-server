spring.application.name=flowtrail-server
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:18081}
spring.datasource.url=${FLOWTRAIL_DB_URL:jdbc:h2:file:./data/flowtrail-runtime-v2;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
spring.datasource.username=${FLOWTRAIL_DB_USER:sa}
spring.datasource.password=${FLOWTRAIL_DB_PASSWORD:}
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.threads.virtual.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.parser.strict-duplicate-detection=true
spring.main.banner-mode=off
server.error.include-message=never
server.error.include-stacktrace=never
flowtrail.runtime.workers=8
flowtrail.runtime.per-run=4
flowtrail.runtime.queue-capacity=32
flowtrail.runtime.lease-seconds=15
flowtrail.runtime.retry-delays-ms=1000,3000
flowtrail.model.base-url=${FLOWTRAIL_MODEL_BASE_URL:https://api.openai.com}
flowtrail.model.name=${FLOWTRAIL_MODEL_NAME:gpt-4o-mini}
flowtrail.model.api-key=${FLOWTRAIL_MODEL_API_KEY:}
flowtrail.model.version=${FLOWTRAIL_MODEL_VERSION:deployment-v1}
