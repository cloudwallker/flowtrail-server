name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify
        run: mvn -B -ntp clean verify
      - name: Verify packaged service and persistence
        run: python scripts/smoke.py
      - name: Check dependency license inventory
        run: python scripts/collect_licenses.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: flowtrail-server-${{ runner.os }}
          path: target/flowtrail-server-dist.zip
          if-no-files-found: error
