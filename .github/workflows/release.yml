name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag
        shell: python
        run: |
          import os, xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          version = root.find('{http://maven.apache.org/POM/4.0.0}version').text
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag does not match project version'
      - run: mvn -B -ntp clean verify
      - run: python scripts/smoke.py
      - run: python scripts/collect_licenses.py --check
      - name: Publish verified archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/flowtrail-server-dist.zip --verify-tag --generate-notes
